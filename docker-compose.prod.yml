# 生产编排（裸 IP X 方案，独立使用，不与 docker-compose.yml 叠加）。
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 为何独立而非 override：compose 多文件对 volumes/ports 是"追加"语义，
# 无法在 override 里移除 dev 的源码 bind mount，故单独成文更干净可靠。
#
# 前端公网地址通过 .env 的 PUBLIC_API_URL / PUBLIC_WS_URL 注入（build 时烘焙）：
#   PUBLIC_API_URL=http://<公网IP>:8000
#   PUBLIC_WS_URL=ws://<公网IP>:8000
#   CORS_ORIGINS=http://<公网IP>:5173

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: codessentinel
      POSTGRES_PASSWORD: codessentinel
      POSTGRES_DB: codessentinel
    volumes:
      - .docker-data/postgres:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/10-extensions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codessentinel -h localhost -d codessentinel"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    volumes:
      - .docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://codessentinel:codessentinel@postgres:5432/codessentinel
      REDIS_URL: redis://redis:6379/0
    # 去掉 --reload；entrypoint.sh 仍会先跑 alembic upgrade head
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  worker:
    build: ./backend
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://codessentinel:codessentinel@postgres:5432/codessentinel
      REDIS_URL: redis://redis:6379/0
    command: ["arq", "app.tasks.worker.WorkerSettings"]
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
        VITE_WS_URL: ${PUBLIC_WS_URL:-ws://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      - backend
