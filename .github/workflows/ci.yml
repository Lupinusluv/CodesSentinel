name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest + alembic)
    runs-on: ubuntu-latest

    services:
      # pgvector image (not plain postgres): the schema has a vector column and
      # migration 0001 runs CREATE EXTENSION vector. POSTGRES_USER=codessentinel
      # is created as a superuser by the postgres entrypoint, so the extension
      # can be created. DB name matches conftest's TEST_DATABASE_URL exactly
      # (codessentinel_test) — a mismatch would make the integration tests
      # silently skip (green but nothing tested).
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: codessentinel
          POSTGRES_PASSWORD: codessentinel
          POSTGRES_DB: codessentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codessentinel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Settings has required fields (deepseek/dashscope/database_url); without a
      # .env file in CI they must come from the environment, or import fails at
      # collection. APP_ENV=test keeps the production fail-closed validator dormant.
      APP_ENV: test
      DEEPSEEK_API_KEY: dummy-for-ci
      DASHSCOPE_API_KEY: dummy-for-ci
      DATABASE_URL: postgresql+asyncpg://codessentinel:codessentinel@localhost:5432/codessentinel_test
      TEST_DATABASE_URL: postgresql+asyncpg://codessentinel:codessentinel@localhost:5432/codessentinel_test
      REDIS_URL: redis://localhost:6379/0

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Format check (black, line-length 100)
        run: black --check app tests scripts alembic main.py

      - name: Apply migrations (creates schema + pgvector extension)
        run: alembic upgrade head

      - name: Run tests (unit + integration against the DB)
        run: pytest tests/ -v

  frontend:
    name: Frontend (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
